[package]
name = "slopp"
description = "SLOPP: an XAMPP-style control panel for Apache, PHP, MariaDB and phpMyAdmin, built with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slopp-core.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
uds_windows = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
dirs.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSBitmapImageRep",
    "NSButton",
    "NSControl",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
# Unconditional: a target-specific build dependency is matched against the
# host, so a cross build from Linux wouldn't get it.
winresource = { version = "0.1.31", default-features = false }
