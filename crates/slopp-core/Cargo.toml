[package]
name = "slopp-core"
description = "SLOPP core: runs the stack (Apache, PHP, MariaDB, phpMyAdmin) without a GUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sloppctl"
path = "src/bin/sloppctl.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
tracing.workspace = true
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
getrandom = "0.3"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# CreateEventW, to stand in for a server's shutdown event.
windows-sys = { version = "0.61", features = ["Win32_Security"] }
