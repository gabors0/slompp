[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
slopp-core = { path = "crates/slopp-core" }

gpui-kit = "=0.7.1"

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[profile.dev]
# GPUI is painfully slow unoptimised; optimise dependencies but keep our code fast to build.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
