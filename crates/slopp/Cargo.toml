[package]
name = "slopp"
description = "SLOPP: an XAMPP-style control panel for Apache, PHP, MariaDB and phpMyAdmin, built with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
slopp-core.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSBitmapImageRep",
    "NSButton",
    "NSControl",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
