# Builds SLOPP for Linux (AppImage and tarball), macOS (dmg) and Windows
# (Inno Setup installer and zip) when a version tag is pushed, and publishes
# them as a GitHub release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the workspace version in Cargo.toml. "Run workflow" in the
# Actions tab builds the chosen branch without releasing it, for all platforms
# or one; the builds are then attached to the run as artifacts. From a shell:
#
#   gh workflow run release.yml --ref <branch> -f platforms=windows
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [all, linux, macos, windows]
        default: all

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

  linux:
    needs: version
    # A tag builds everything (no inputs, so 'all').
    if: contains(fromJSON('["all", "linux"]'), inputs.platforms || 'all')
    # The binaries need the glibc of the build machine or newer (2.39 here).
    runs-on: ubuntu-24.04
    env:
      NAME: slopp-${{ needs.version.outputs.version }}-linux-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The libraries the panel links against; Wayland and Vulkan are loaded
      # at run time.
      - name: Install GPUI's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev
      # Builds the binaries and the AppImage (here, beside the tarball:
      # artifacts keep their paths below the files' common folder).
      - run: scripts/bundle-linux.sh .
      - name: Package
        run: |
          mkdir "$NAME"
          cp target/release/slopp target/release/sloppctl README.md "$NAME/"
          cp crates/slopp/assets/linux/org.slopp.Slopp.desktop \
            crates/slopp/assets/linux/org.slopp.Slopp.svg "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            ${{ env.NAME }}.tar.gz
            ${{ env.NAME }}.AppImage
          if-no-files-found: error

  macos:
    needs: version
    if: contains(fromJSON('["all", "macos"]'), inputs.platforms || 'all')
    runs-on: macos-15
    env:
      NAME: slopp-${{ needs.version.outputs.version }}-macos-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/bundle-macos.sh --dmg .
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ${{ env.NAME }}.dmg
          if-no-files-found: error

  windows:
    needs: version
    if: contains(fromJSON('["all", "windows"]'), inputs.platforms || 'all')
    # Native, not cross-compiled: GPUI's release build compiles its shaders
    # with fxc from the Windows SDK, which the runner has.
    runs-on: windows-2025
    env:
      NAME: slopp-${{ needs.version.outputs.version }}-windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p slopp -p slopp-core
      # .cargo/config.toml links the C runtime statically, since a fresh
      # Windows has no VCRUNTIME140.dll. The runner has it (Visual Studio),
      # so only this check notices when that stops working.
      - name: Check the programs need no Visual C++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1).FullName
          foreach ($exe in 'slopp.exe', 'sloppctl.exe') {
            $deps = & $dumpbin /nologo /dependents "target/release/$exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $runtime = $deps | Select-String -Pattern '^\s*(vcruntime|msvcp)\S*\.dll'
            if ($runtime) {
              Write-Error "$exe needs $(($runtime | ForEach-Object { $_.Line.Trim() }) -join ', ')"
              exit 1
            }
            "$exe needs:"; $deps | Select-String -Pattern '\.dll' | ForEach-Object { "  " + $_.Line.Trim() }
          }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:NAME | Out-Null
          Copy-Item target/release/slopp.exe, target/release/sloppctl.exe, README.md -Destination $env:NAME
          Compress-Archive -Path $env:NAME -DestinationPath "$env:NAME.zip"
      # The runner image has Inno Setup 6: ISCC from PATH, else its default
      # folder.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/O$PWD" "/DAppVersion=${{ needs.version.outputs.version }}" crates/slopp/assets/windows/slopp.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            ${{ env.NAME }}.zip
            ${{ env.NAME }}-setup.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            SLOPP runs the stock servers, so install them first: Apache, PHP-FPM
            (or PHP's Apache module) and the MariaDB server from your package
            manager on Linux, `brew install php mariadb` on macOS, and on
            Windows Apache Lounge's Apache, PHP's Thread Safe build and
            MariaDB's installer (see the README).

            **Linux** (x86_64, glibc 2.39 or newer): download the AppImage,
            make it executable (`chmod +x`) and run it. It adds itself to the
            desktop's applications (for the menu and the taskbar icon); a
            symlink to it named `sloppctl` runs `sloppctl`. The tarball has
            the plain binaries. On NixOS use `nix run` instead.

            **macOS** (Apple silicon): open the dmg and drag `SLOPP.app` to
            Applications. The app isn't notarized, so macOS blocks the first
            launch: allow it in System Settings → Privacy & Security (Open
            Anyway), or run
            `xattr -dr com.apple.quarantine /Applications/SLOPP.app`.

            **Windows** (x86_64, Windows 10 or newer; new, so expect rough
            edges): run the setup, which installs for your user without
            admin rights, or unzip the zip and run `slopp.exe` (`sloppctl.exe`
            from a terminal). Neither is signed, so SmartScreen may warn:
            More info → Run anyway.
